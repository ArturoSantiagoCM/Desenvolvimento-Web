name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Find frontend path
        id: find_path
        run: |
          INDEX_FILE=$(find . -path "*/frontend/index.html" -print -quit)
          if [ -z "$INDEX_FILE" ]; then
            echo "Pasta frontend/index.html não encontrada. Estrutura atual:"
            find . -maxdepth 4 -not -path '*/.*'
            exit 1
          fi
          FRONTEND_DIR=$(dirname "$INDEX_FILE")
          echo "Pasta encontrada: '$FRONTEND_DIR'"
          echo "dir=$FRONTEND_DIR" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_path.outputs.dir }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
