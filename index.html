<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f5f9">
  <title>GoHelping</title>
  <link rel="icon" type="image/png" href="/public/GoHelpingICON.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- BIBLIOTECAS PARA O GLOBO -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.41.2/dist/globe.gl.min.js"></script>

  <!-- Sessão: já marca <html data-sessao="logado|visitante"> antes da tela aparecer (sem piscar) -->
  <script src="script/Comum/Armazenamento.js"></script>
  <script src="index.js" defer></script>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- CABEÇALHO: menu | título | conta -->
  <header class="topo">
    <button type="button" id="btn-menu" class="icone-btn topo__menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <h1 class="topo__titulo">GoHelping</h1>

    <!-- Só um dos dois aparece: com conta neste dispositivo = perfil; sem conta = entrar -->
    <div class="topo__conta">
      <a data-auth="logado" class="icone-btn" href="pages/Perfil/PerfilUsuario.html" aria-label="Meu perfil" title="Meu perfil">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      </a>
      <a data-auth="visitante" class="btn-entrar" href="pages/Perfil/PerfilUsuario.html" aria-label="Entrar na minha conta">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h3a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-3"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        <span>Entrar</span>
      </a>
    </div>

    <!-- MENU: gaveta no celular/tablet, links no topo no computador -->
    <nav id="menu" aria-label="Menu principal">
      <div class="menu__cabecalho">
        <strong>GoHelping</strong>
        <button type="button" id="btn-fechar-menu" class="icone-btn" aria-label="Fechar menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ul>
        <li><a href="index.html" data-icone="inicio" aria-current="page">Início</a></li>
        <li><a href="pages/Cadastros/LocaldeAjuda/RegistroLocal.html" data-icone="registrar">Registrar Local de Ajuda</a></li>
        <li><a href="pages/MapaMundi/MapaMundi.html" data-icone="mapa">Mapa Mundial</a></li>
        <li data-auth="logado"><a href="pages/Perfil/PerfilUsuario.html" data-icone="perfil">Meu Perfil</a></li>
        <li data-auth="visitante"><a href="pages/Perfil/PerfilUsuario.html" data-icone="entrar">Entrar</a></li>
      </ul>
    </nav>
  </header>
  <div id="menu-fundo" hidden></div>

  <main>
    <!-- BARRA DE BUSCA -->
    <section class="busca">
      <form id="form-busca" action="#" method="get" role="search">
        <label for="busca">Buscar país ou região para ajudar:</label>
        <svg class="busca__lupa" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="busca" name="busca" placeholder="Buscar país ou região para ajudar" enterkeyhint="search" autocomplete="off">
        <button type="submit">Buscar</button>
      </form>
      <p id="msg-busca" aria-live="polite"></p>
    </section>

    <!-- GLOBO -->
    <section class="palco" aria-label="Globo com os pontos de ajuda">
      <div id="globo-3d"></div>
      <div class="palco__texto">
        <p class="palco__marca">GoHelping</p>
        <p class="palco__frase">Onde há uma necessidade, existe uma chance de ajudar.</p>
      </div>
    </section>

    <!-- LOCAIS DE AJUDA: painel que sobe quando se arrasta (preenchido pelo index.js) -->
    <section id="painel" class="painel" data-estado="fechado" aria-labelledby="painel-titulo">
      <div id="painel-alca" class="painel__alca">
        <span class="painel__barra" aria-hidden="true"></span>
        <button type="button" id="painel-botao" class="painel__seta" aria-expanded="false" aria-controls="lista-locais" aria-label="Mostrar pontos de ajuda">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <h3 id="painel-titulo">Pontos de Ajuda Recentes</h3>
      </div>
      <div id="lista-locais" class="painel__lista"></div>
    </section>
  </main>

</body>
</html>
