
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Verificar Conta - Passo 3 | GoHelping</title>
    <meta name="description" content="Crie sua conta em GoHelping. Onde há uma necessidade, existe uma chance de ajudar.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../style/Cadastros/Pessoa/CP_3.css">
    <script src="../../../script/Cadastros/Pessoa/CP_3.js" defer></script>
</head>
<body>
    <div>
        <a href="CP_2.html" class="voltar" aria-label="Voltar">&#8592;</a>
        <h1>Verificar Conta</h1>
    </div>

    <section class="progresso" aria-label="Progresso do cadastro">
        <p>Passo 3 de 3</p>
        <div class="barra">
            <div class="barra-preenchida"></div>
        </div>
    </section>

    <form action="CP_4.html" method="GET">
        <div>
            <fieldset>
                <legend>SELFIE DE CONFIRMAÇÃO</legend>

                <label for="foto">Tire uma selfie:</label>
                <input
                    type="file"
                    id="foto"
                    name="foto"
                    accept="image/*"
                    capture="user"
                    required
                >
            </fieldset>
        </div>

        <div class="acoes">
            <div class="botao-voltar">
                <a href="CP_2.html" class="boton-secundario">
                    Voltar
                </a>
            </div>

            <div class="botao-continuar">
                <button type="submit" class="boton">
                    Continuar
                </button>
            </div>
        </div>
    </form>
</body>
</html>
