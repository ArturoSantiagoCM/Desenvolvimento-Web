<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Verificar Conta - Passo 1 | GoHelping</title>
    <meta name="description" content="Crie sua conta em GoHelping. Onde há uma necessidade, existe uma chance de ajudar.">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../style/Cadastros/Pessoa/CP_1.css">
    <script src="../../../script/Comum/Armazenamento.js"></script>
    <script src="../../../script/Cadastros/Pessoa/CP_1.js" defer></script>
</head>
<body>
    <div>
        <a href="../../../index.html" class="voltar" aria-label="Voltar">&#8592;</a>
        <h1>Verificar Conta</h1>
    </div>

    <section class="progresso" aria-label="Progresso do cadastro">
        <p>Passo 1 de 3</p>
        <div class="barra">
            <div class="barra-preenchida"></div>
        </div>
    </section>

    <form id="form-cp1" novalidate>
        <div>
            <fieldset>
                <legend>Identidade Pessoal</legend>

                <label for="nome">Nome completo (como no documento):</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Gustavo Alencar"
                    maxlength="100"
                    aria-describedby="nameCounter erro-nome"
                    aria-invalid="false"
                    required
                >

                <span id="erro-nome" class="msg-erro" style="display: none; color: #d93025; font-size: 0.875rem; margin-top: 4px;"></span>
                <span id="nameCounter"></span>

                <label for="datan">Data de Nascimento:</label>
                <input
                    type="date"
                    id="datan"
                    name="datan"
                    aria-describedby="dateError"
                    aria-invalid="false"
                    required
                >

                <span id="dateError" class="msg-erro" style="display: none; color: #d93025; font-size: 0.875rem; margin-top: 4px;"></span>

                <label for="paises">País de residência:</label>
                <select id="paises" name="pais" aria-describedby="erro-pais" required>
                    <option value="">Selecione...</option>
                    <option value="br">Brasil</option>
                    <option value="pt">Portugal</option>
                    <option value="ar">Argentina</option>
                    <option value="us">Estados Unidos</option>
                    <option value="jp">Japão</option>
                </select>
                <span id="erro-pais" class="msg-erro" style="display: none;"></span>
            </fieldset>
        </div>

        <div>
            <p class="ja-tem-conta">Já tem conta? <a href="../../Perfil/PerfilUsuario.html">Entrar</a></p>
            <button type="submit" class="boton" id="continuarCP1">Continuar</button>
        </div>
    </form>
</body>
</html>
