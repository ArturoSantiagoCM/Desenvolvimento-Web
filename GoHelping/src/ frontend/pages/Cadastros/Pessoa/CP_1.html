<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Verificar Conta - Passo 1 | GoHelping</title>
    <meta name="description" content="Crie sua conta em GoHelping. Onde há uma necessidade, existe uma chance de ajudar.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../../script/Cadastros/Pessoa/CP_1.js" defer></script>
</head>
<body>
    <div>
        <a href="/src/ frontend/index.html" class="voltar">Icone de voltar no css</a>
        <h1>Verificar Conta</h1>
        <h4>Identidade verificada gera mais confiança</h4>
    </div>
    
    <form>
        <div>
            <fieldset>
                <legend>Identidade Pessoal</legend>
                <form>
                <label for="nome">Nome completo (como no documento):</label>
                <input type="text" id="nome" name="nome" placeholder="Gustavo Alencar" maxlength="100" aria-describedby="nameCounter erro-nome" aria-invalid="false" required><br>
                <span id="erro-nome" style="display: none; color: #d93025; font-size: 0.875rem; margin-top: 4px;"></span>
                <span id="nameCounter"></span>
                <label for="datan">Data de Nascimento:</label>
                <input type="date" id="datan" name="datan" aria-describedby="dateError" aria-invalid="false" required><br>
                <span id="dateError" style="display: none; color: #d93025; font-size: 0.875rem; margin-top: 4px;"></span>
                <label for="paises">País de residência:</label>
                <select id="paises" name="pais">
                    <option value="">Selecione...</option>
                    <option value="br">Brasil</option>
                    <option value="pt">Portugal</option>
                    <option value="ar">Argentina</option>
                    <option value="us">Estados Unidos</option>
                    <option value="jp">Japão</option>
                </select>
                </form>
            </fieldset>
        </div>
        <div>
            <a href="CP_2.HTML" class="boton">Continuar</a>
        </div>
    </form>
</body>
</html>
