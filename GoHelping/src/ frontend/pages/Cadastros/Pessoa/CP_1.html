<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Verificar Conta - Passo 1 | GoHelping</title>
    <meta name="description" content="Crie sua conta em GoHelping. Onde há uma necessidade, existe uma chance de ajudar.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../style/Cadastros/Pessoa/CP_1.css">
    <script src="../../../script/Cadastros/Pessoa/CP_1.js" defer></script>
</head>
<body>
    <div>
        <a href="/src/frontend/index.html" class="voltar" aria-label="Voltar">&#8592;</a>
        <h1>Verificar Conta</h1>
    </div>
    
    <section class="progresso" aria-label="Progresso do cadastro">
        <p>Passo 1 de 3</p>
        <div class="barra"><div class="barra-preenchida"></div></div>
    </section>
    
    <form >
        <div>
            <fieldset>
                <legend>Identidade Pessoal</legend>
                
                <label for="nome">Nome completo (como no documento):</label>
                <input type="text" id="nome" name="nome" placeholder="Gustavo Alencar" maxlength="100" aria-describedby="nameCounter erro-nome" aria-invalid="false" required>
                <span id="erro-nome" style="display: none; color: #d93025; font-size: 0.875rem; margin-top: 4px;"></span>
                <span id="nameCounter"></span>
                
                <label for="datan">Data de Nascimento:</label>
                <input type="date" id="datan" name="datan" aria-describedby="dateError" aria-invalid="false" required>
                <span id="dateError" style="display: none; color: #d93025; font-size: 0.875rem; margin-top: 4px;"></span>
                
                <label for="paises">País de residência:</label>
                <select id="paises" name="pais" required>
                    <option value="">Selecione...</option>
                    <option value="br">Brasil</option>
                    <option value="pt">Portugal</option>
                    <option value="ar">Argentina</option>
                    <option value="us">Estados Unidos</option>
                    <option value="jp">Japão</option>
                </select>
            </fieldset>
        </div>
        <div>
            <!-- Pode usar a tag <a> como estava, ou <button> para submeter o formulário corretamente -->
            <a href="../../Cadastros/Pessoa/CP_2.html" class="boton">Continuar</a>
        </div>
    </form>
</body>
</html>
