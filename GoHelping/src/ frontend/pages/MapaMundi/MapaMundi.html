<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GoHelping - Mapa Mundial</title>
    <meta name="description" content="Mapa mundi do GoHelping. Onde há uma necessidade, existe uma chance de ajudar.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Fonts: DM Sans -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Arquivo CSS Externo -->
    <link rel="stylesheet" href="../../style/MapaMundi/MapaMundi.css">
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <a href="../../index.html" class="back-button" title="Voltar">←</a>
        <div class="header-titles">
            <h1>Mapa Mundial</h1>
            <p>Emergências verificadas · GoHelping</p>
        </div>
    </header>

    <div id="meu-mapa" style="height: 100% ; border-radius: 8px; border: 1px solid #161616; ;"></div>
    <input type="hidden" id="latitude" name="latitude">
    <input type="hidden" id="longitude" name="longitude">

    <!-- LEGENDA DO MAPA -->
    <div class="map-legend">
        <div class="legend-item"><span class="legend-dot dot-conflito"></span> Conflito</div>
        <div class="legend-item"><span class="legend-dot dot-humanitaria"></span> Humanitária</div>
        <div class="legend-item"><span class="legend-dot dot-inundacao"></span> Inundação</div>
        <div class="legend-item"><span class="legend-dot dot-secafome"></span> Seca/Fome</div>
        <div class="legend-item"><span class="legend-dot dot-terremoto"></span> Terremoto</div>
    </div>

  

    <!-- Script do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../script/MapaMundi/MapaMundi.js"></script>

</body>
</html>
