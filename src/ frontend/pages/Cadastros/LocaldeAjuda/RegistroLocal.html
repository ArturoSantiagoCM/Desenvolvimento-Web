<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>GoHelping - Registrar Local</title>
</head>
<body>

  <header>
    <a href="/src/ frontend/index.html">← Voltar para a tela Inicial</a>
    <h1>Registrar Local de Ajuda</h1>
  </header>

  <hr>

  <main>
    <form action="#" method="post">
      
      <!-- CONTATO -->
      <fieldset>
        <legend>Passo 1: Seus Dados de Contato</legend>
        <igtform>
        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="telefone">Telefone/WhatsApp:</label><br>
        <input type="tel" id="telefone" name="telefone" required><br><br>

        <label for="ong">Organização / ONG (opcional):</label><br>
        <input type="text" id="ong" name="ong"><br><br>

        <label for="site">Site (opcional):</label><br>
        <input type="text" id="site" name="site"><br><br>
        </form>
      </fieldset>

      <br>

      <!-- LOCALIZAÇÃO -->
      <fieldset>
        <legend>Passo 2: Localização do Ponto de Ajuda</legend>
        <form>
        <label for="tipo">Tipo de emergência:</label><br>
        <select id="tipo" name="tipo" required>
          <option value="">Selecionar...</option>
          <option value="coleta">Centro de Coleta</option>
          <option value="veterinario">Centro Veterinário</option>
          <option value="medico">Centro Médico</option>
          <option value="ong">ONG</option>
        </select><br><br>

        <label for="pais">País:</label><br>
        <input type="text" id="pais" name="pais" placeholder="Ex: Venezuela, Brasil..." required><br><br>

        <label for="cidade">Cidade / Município:</label><br>
        <input type="text" id="cidade" name="cidade" placeholder="Ex: Caracas, São Paulo..." required><br><br>

        <label for="endereço">Endereço completo:</label><br>
        <textarea id="endereço" name="endereço" rows="3" cols="40" placeholder="Ex: Rua, Número, Bairro..." required></textarea><br><br>
      </form>
      </fieldset>

      <br>

      <!-- O QUE DOAR -->
      <fieldset>
        <form>
        <legend>Passo 3: Descrição e Necessidades</legend>
        <label for="situação">Descrição do local:</label><br>
        <textarea id="situação" name="situação" rows="4" cols="40" placeholder="Descreva a situação do local, quem é atendido, como funciona o ponto de ajuda..."></textarea><br><br>

        <label for="doações">O que é necessário doar?</label><br>
        <textarea id="doações" name="doações" rows="4" cols="40" placeholder="Ex: Alimentos, Roupas, Medicamentos..."></textarea>
      </form>
      </fieldset>

      <br>

      <button type="submit">Enviar Local para Análise</button>
    </form>
  </main>

</body>
</html>
